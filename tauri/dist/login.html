<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenChat - Connect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(27, 27, 31, 0.95);
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo p {
            color: #8e8e93;
            margin-top: 8px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d1d2d3;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #3e4147;
            border-radius: 8px;
            background: #2b2e33;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .input-group input::placeholder {
            color: #616061;
        }
        .input-group.code-input input {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 8px;
            text-transform: uppercase;
        }
        .server-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .server-row input {
            flex: 1;
        }
        .server-row .edit-btn {
            width: auto;
            padding: 14px 16px;
            background: #3e4147;
            font-size: 14px;
        }
        .server-row .edit-btn:hover {
            background: #4e5157;
            transform: none;
            box-shadow: none;
        }
        .server-display {
            padding: 14px 16px;
            border: 1px solid #3e4147;
            border-radius: 8px;
            background: #2b2e33;
            color: #8e8e93;
            font-size: 14px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .help-text {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #8e8e93;
        }
        .error {
            background: rgba(237, 66, 69, 0.1);
            border: 1px solid #ed4245;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #ed4245;
            font-size: 14px;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>OpenChat</h1>
            <p>Enter your 6-digit pairing code</p>
        </div>
        <div id="error" class="error"></div>
        <form id="loginForm">
            <div class="input-group" id="serverInputGroup">
                <label for="serverUrl">Server</label>
                <div class="server-row" id="serverEditRow" style="display: none;">
                    <input type="url" id="serverUrl" placeholder="https://your-server.com">
                    <button type="button" class="edit-btn" id="saveServerBtn">Save</button>
                </div>
                <div class="server-row" id="serverDisplayRow">
                    <div class="server-display" id="serverDisplay">Not configured</div>
                    <button type="button" class="edit-btn" id="editServerBtn">Edit</button>
                </div>
            </div>
            <div class="input-group code-input">
                <label for="code">Pairing Code</label>
                <input type="text" id="code" placeholder="ABC123" maxlength="6" autocomplete="off">
            </div>
            <button type="submit" id="submitBtn">Connect</button>
        </form>
        <p class="help-text">
            Get your pairing code from Settings in your OpenChat web app.
        </p>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const serverUrlInput = document.getElementById('serverUrl');
        const serverDisplay = document.getElementById('serverDisplay');
        const serverEditRow = document.getElementById('serverEditRow');
        const serverDisplayRow = document.getElementById('serverDisplayRow');
        const editServerBtn = document.getElementById('editServerBtn');
        const saveServerBtn = document.getElementById('saveServerBtn');
        const codeInput = document.getElementById('code');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('error');

        const STORAGE_KEY = 'openchat_server_url';

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function clearError() {
            errorDiv.classList.remove('show');
        }

        function getSavedServerUrl() {
            return localStorage.getItem(STORAGE_KEY) || '';
        }

        function saveServerUrl(url) {
            localStorage.setItem(STORAGE_KEY, url);
        }

        function showServerEdit() {
            serverEditRow.style.display = 'flex';
            serverDisplayRow.style.display = 'none';
            serverUrlInput.focus();
        }

        function showServerDisplay() {
            const url = getSavedServerUrl();
            if (url) {
                serverDisplay.textContent = url;
                serverEditRow.style.display = 'none';
                serverDisplayRow.style.display = 'flex';
                codeInput.focus();
            } else {
                showServerEdit();
            }
        }

        function getTauriInvoke() {
            if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                return window.__TAURI__.core.invoke;
            }
            if (window.__TAURI__ && window.__TAURI__.tauri && window.__TAURI__.tauri.invoke) {
                return window.__TAURI__.tauri.invoke;
            }
            if (window.__TAURI_INVOKE__) {
                return window.__TAURI_INVOKE__;
            }
            return null;
        }

        // Initialize
        showServerDisplay();

        editServerBtn.addEventListener('click', () => {
            serverUrlInput.value = getSavedServerUrl();
            showServerEdit();
        });

        saveServerBtn.addEventListener('click', () => {
            const url = serverUrlInput.value.trim().replace(/\/+$/, '');
            if (!url) {
                showError('Please enter a server URL');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showError('Server URL must start with http:// or https://');
                return;
            }
            clearError();
            saveServerUrl(url);
            showServerDisplay();
        });

        // Auto-uppercase and limit to alphanumeric
        codeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const invoke = getTauriInvoke();
            if (!invoke) {
                showError('Tauri API not available. Please restart the app.');
                return;
            }

            const apiUrl = getSavedServerUrl();
            const code = codeInput.value.trim().toUpperCase();

            if (!apiUrl) {
                showError('Please configure the server URL first');
                showServerEdit();
                return;
            }

            if (!code) {
                showError('Please enter a pairing code');
                codeInput.focus();
                return;
            }

            if (code.length < 6) {
                showError('Pairing code must be 6 characters');
                codeInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Connecting...';

            try {
                const response = await invoke('verify_pairing_code', {
                    apiUrl: apiUrl,
                    code: code,
                    deviceName: 'Windows Desktop'
                });

                await invoke('login_success', { apiUrl: response.api_url });
            } catch (err) {
                showError(err.toString());
                submitBtn.disabled = false;
                submitBtn.textContent = 'Connect';
                codeInput.focus();
                codeInput.select();
            }
        });
    </script>
</body>
</html>
