name: API Release

on:
  push:
    tags:
      - 'api-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build binaries only (no GitHub release)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
          - target: aarch64-unknown-linux-gnu
            runner: [self-hosted, Linux, ARM64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/api-v')
        run: |
          CARGO_VERSION=$(grep -m1 '^version' api/Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#api-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match api/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release
        working-directory: api
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          SQLX_OFFLINE: "true"

      - name: Package binaries
        run: |
          VERSION=$(grep -m1 '^version' api/Cargo.toml | cut -d'"' -f2)
          for BINARY in openchat-api openchat-worker; do
            ARCHIVE_NAME="${BINARY}-${VERSION}-${{ matrix.target }}"
            mkdir -p "${ARCHIVE_NAME}"
            cp "api/target/${{ matrix.target }}/release/${BINARY}" "${ARCHIVE_NAME}/${BINARY}"
            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/api-v')
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenChat API ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

      - name: Prune old releases (tags are kept)
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const apiReleases = releases
              .filter(r => r.tag_name.startsWith('api-v'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of apiReleases.slice(10)) {
              console.log(`Deleting release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }
