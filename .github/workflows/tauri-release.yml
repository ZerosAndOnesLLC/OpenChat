name: Tauri Desktop Release

# Runs when a GitHub release tagged desktop-v<version> is published
# (`gh release create desktop-vX.Y.Z --generate-notes`), and uploads the
# build into that release. Re-run for an existing release with
# workflow_dispatch and its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload to (e.g. desktop-v1.2.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Pinned so a new CLI release can't change a release build unannounced.
  # Keep in the same 2.x minor as @tauri-apps/api in webui/package.json.
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  build-tauri:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            os: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            os: linux
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            os: windows
          - runner: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            os: macos

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' tauri/Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${TAG#desktop-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match tauri/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Build webui
        working-directory: webui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Copy webui build to tauri
        shell: bash
        run: |
          rm -rf tauri/dist
          cp -r webui/out tauri/dist

      - name: Build Tauri app
        working-directory: tauri
        shell: bash
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-artifacts
          case "${{ matrix.os }}" in
            linux)   files=("$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm) ;;
            windows) files=("$BUNDLE"/nsis/*.exe "$BUNDLE"/msi/*.msi) ;;
            macos)   files=("$BUNDLE"/dmg/*.dmg) ;;
          esac
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under $BUNDLE"
            exit 1
          fi
          cp "${files[@]}" release-artifacts/
          cd release-artifacts
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # The release already exists (gh release create made it and the tag);
      # name it and upload the build into it.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.AppImage *.deb *.rpm *.exe *.msi *.dmg *.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release files downloaded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenChat Desktop $TAG"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Prune old releases (tags are kept)
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const desktopReleases = releases
              .filter(r => r.tag_name.startsWith('desktop-v'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of desktopReleases.slice(10)) {
              console.log(`Deleting release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }
