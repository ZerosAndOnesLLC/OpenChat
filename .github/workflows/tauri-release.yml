name: Tauri Desktop Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'tauri/**'
      - 'webui/**'
      - '.github/workflows/tauri-release.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        working-directory: tauri
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Desktop Version: $VERSION"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: OpenChat Desktop v${{ steps.version.outputs.version }}
          body: |
            ## OpenChat Desktop v${{ steps.version.outputs.version }}

            ### Downloads
            | Platform | Download |
            |----------|----------|
            | Windows | `OpenChat_${{ steps.version.outputs.version }}_x64-setup.exe` |
            | macOS (Intel) | `OpenChat_${{ steps.version.outputs.version }}_x64.dmg` |
            | macOS (Apple Silicon) | `OpenChat_${{ steps.version.outputs.version }}_aarch64.dmg` |
            | Linux (AppImage) | `OpenChat_${{ steps.version.outputs.version }}_amd64.AppImage` |
            | Linux (Debian) | `OpenChat_${{ steps.version.outputs.version }}_amd64.deb` |

            ### Features
            - Cross-platform desktop client
            - System tray integration
            - Native notifications
            - Secure credential storage

            See [documentation](https://github.com/ZerosAndOnesLLC/OpenChat#readme) for setup instructions.
          draft: true
          prerelease: false

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-tauri-${{ hashFiles('tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-tauri-

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Build webui
        working-directory: webui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Copy webui build to tauri
        shell: bash
        run: |
          rm -rf tauri/dist
          cp -r webui/out tauri/dist

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri app
        working-directory: tauri
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.create-release.outputs.version }}
          files: |
            tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.create-release.outputs.version }}
          files: |
            tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.create-release.outputs.version }}
          files: |
            tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
