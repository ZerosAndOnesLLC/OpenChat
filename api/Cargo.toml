[package]
name = "openchat-api"
version = "0.70.3"
edition = "2024"

[[bin]]
name = "openchat-api"
path = "src/main.rs"

[[bin]]
name = "openchat-worker"
path = "src/bin/worker.rs"

[dependencies]
# Web Framework
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-ws = "0.3"
actix-cors = "0.7"
actix = "0.13"
actix-multipart = "0.7"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"

# Async Runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
    "chrono"
] }

# Redis (Caching + Pub/Sub)
redis = { version = "0.32.7", features = [
    "tokio-comp",
    "connection-manager",
    "streams",
    "tls-rustls",
    "tokio-rustls-comp"
] }
deadpool-redis = { version = "0.22", features = ["rt_tokio_1"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Authentication & Cryptography
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Regex
regex = "1"

# File Storage
aws-sdk-s3 = "1"
aws-config = "1"
mime = "0.3"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
bytes = "1"
base64 = "0.22"

# Image Processing
image = "0.25"

# Compression
flate2 = "1.0"
