name: API Release

# Runs when a GitHub release tagged api-v<version> is published
# (`gh release create api-vX.Y.Z --generate-notes`), and uploads the
# build into that release. Re-run for an existing release with
# workflow_dispatch and its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload to (e.g. api-v1.2.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: api-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'api-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(grep -m1 '^version' api/Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${TAG#api-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match api/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          key: ${{ matrix.target }}

      - name: Build release
        working-directory: api
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          SQLX_OFFLINE: "true"

      - name: Package binaries
        run: |
          VERSION=$(grep -m1 '^version' api/Cargo.toml | cut -d'"' -f2)
          for BINARY in openchat-api openchat-worker; do
            ARCHIVE_NAME="${BINARY}-${VERSION}-${{ matrix.target }}"
            mkdir -p "${ARCHIVE_NAME}"
            cp "api/target/${{ matrix.target }}/release/${BINARY}" "${ARCHIVE_NAME}/${BINARY}"
            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # The release already exists (gh release create made it and the tag);
      # name it and upload the build into it.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.gz *.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release files downloaded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenChat API $TAG"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Prune old releases (tags are kept)
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const apiReleases = releases
              .filter(r => r.tag_name.startsWith('api-v'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of apiReleases.slice(10)) {
              console.log(`Deleting release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }
