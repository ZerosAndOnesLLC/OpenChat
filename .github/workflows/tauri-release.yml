name: Tauri Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build installers only (no GitHub release)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            os: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            os: linux
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            os: windows
          - runner: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            os: macos

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' tauri/Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Build webui
        working-directory: webui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Copy webui build to tauri
        shell: bash
        run: |
          rm -rf tauri/dist
          cp -r webui/out tauri/dist

      - name: Build Tauri app
        working-directory: tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-artifacts
          case "${{ matrix.os }}" in
            linux)   files=("$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm) ;;
            windows) files=("$BUNDLE"/nsis/*.exe "$BUNDLE"/msi/*.msi) ;;
            macos)   files=("$BUNDLE"/dmg/*.dmg) ;;
          esac
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under $BUNDLE"
            exit 1
          fi
          cp "${files[@]}" release-artifacts/
          cd release-artifacts
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenChat Desktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            *.AppImage
            *.deb
            *.rpm
            *.exe
            *.msi
            *.dmg
            *.sha256

      - name: Prune old releases (tags are kept)
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const desktopReleases = releases
              .filter(r => r.tag_name.startsWith('desktop-v'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of desktopReleases.slice(10)) {
              console.log(`Deleting release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }
