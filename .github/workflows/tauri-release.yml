name: Tauri Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webui dependencies
        working-directory: webui
        run: npm install

      - name: Build webui
        working-directory: webui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Copy webui build to tauri
        shell: bash
        run: |
          rm -rf tauri/dist
          cp -r webui/out tauri/dist

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri app
        working-directory: tauri
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cp tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-artifacts/ || true
            cp tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb release-artifacts/ || true
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe release-artifacts/ || true
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-artifacts/ || true
          fi
          cd release-artifacts
          for f in *; do
            sha256sum "$f" > "${f}.sha256" 2>/dev/null || shasum -a 256 "$f" > "${f}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*

  release:
    needs: build-tauri
    runs-on: self-hosted
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenChat Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.AppImage
            *.deb
            *.exe
            *.dmg
            *.sha256

      - name: Clean up old releases
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const desktopReleases = releases
              .filter(r => r.tag_name.startsWith('desktop-v'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of desktopReleases.slice(10)) {
              console.log(`Deleting release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`Deleted tag: ${release.tag_name}`);
              } catch (e) {
                console.log(`Tag ${release.tag_name} already deleted or not found`);
              }
            }
